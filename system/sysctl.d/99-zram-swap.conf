# Swap tuning for zram (Fedora's only swap here is /dev/zram0).
#
# zram is compressed RAM, not disk: swapping to it is cheap. With a low
# swappiness the kernel drops page cache instead -- including the code of
# running programs -- and re-reads it from disk in a loop, which is what
# freezes the desktop when RAM fills up. tuned's throughput-performance
# profile sets swappiness=10; tuned reapplies /etc/sysctl.d after its profile
# (reapply_sysctl = 1 in /etc/tuned/tuned-main.conf), so these values win.
vm.swappiness = 180
# Reclaim earlier and don't boost watermarks after fragmentation events.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# No seek cost on zram: swap readahead only wastes memory.
vm.page-cluster = 0
