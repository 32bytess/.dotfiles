### Key bindings
#
# Basics:
#
    # Start a terminal
    bindsym $mod+Return exec $term
    bindsym $mod+t exec $term
    # Start a terminal with tmux
    bindsym $mod+Shift+Return exec kitty zsh --login -c 'tmux new-session -A -s main; exec zsh'

    # Kill focused window
    bindsym $mod+q kill

    # Start launcher
    bindsym ctrl+space exec $menu
    # Launch app on NVIDIA GPU via PRIME
    bindsym ctrl+Shift+space exec ~/.local/bin/prime-menu

    # Drag floating windows by holding down $mod and left mouse button.
    # Resize them with right mouse button + $mod.
    floating_modifier $mod normal

    # Reload the configuration file
    bindsym $mod+Shift+c reload

    # Exit sway (logs you out of your Wayland session)
    bindsym $mod+Shift+e exec swaynag -t warning -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' -B 'Yes, exit sway' 'swaymsg exit'
#
# Moving around:
#
    bindsym $mod+$left focus left
    bindsym $mod+$down focus down
    bindsym $mod+$up focus up
    bindsym $mod+$right focus right
    # Arrow keys
    bindsym $mod+Left focus left
    bindsym $mod+Down focus down
    bindsym $mod+Up focus up
    bindsym $mod+Right focus right

    # Move the focused window
    bindsym $mod+Shift+$left move left
    bindsym $mod+Shift+$down move down
    bindsym $mod+Shift+$up move up
    bindsym $mod+Shift+$right move right
    # Arrow keys
    bindsym $mod+Shift+Left move left
    bindsym $mod+Shift+Down move down
    bindsym $mod+Shift+Up move up
    bindsym $mod+Shift+Right move right
#
# Workspaces:
#
    bindsym $mod+1 workspace number 1
    bindsym $mod+2 workspace number 2
    bindsym $mod+3 workspace number 3
    bindsym $mod+4 workspace number 4
    bindsym $mod+5 workspace number 5
    bindsym $mod+6 workspace number 6
    bindsym $mod+7 workspace number 7
    bindsym $mod+8 workspace number 8
    bindsym $mod+9 workspace number 9
    bindsym $mod+0 workspace number 10
    # Move focused container to workspace
    bindsym $mod+Shift+1 move container to workspace number 1
    bindsym $mod+Shift+2 move container to workspace number 2
    bindsym $mod+Shift+3 move container to workspace number 3
    bindsym $mod+Shift+4 move container to workspace number 4
    bindsym $mod+Shift+5 move container to workspace number 5
    bindsym $mod+Shift+6 move container to workspace number 6
    bindsym $mod+Shift+7 move container to workspace number 7
    bindsym $mod+Shift+8 move container to workspace number 8
    bindsym $mod+Shift+9 move container to workspace number 9
    bindsym $mod+Shift+0 move container to workspace number 10
#
# Layout:
#
    # Split current container horizontally or vertically
    bindsym $mod+z splith
    bindsym $mod+v splitv

    bindsym $mod+s layout stacking
    bindsym $mod+w layout tabbed
    bindsym $mod+d layout toggle split

    # Fullscreen
    bindsym $mod+f fullscreen

    # Toggle tiling / floating
    bindsym $mod+Shift+space floating toggle

    # Swap focus between tiling and floating area
    bindsym $mod+space focus mode_toggle

    # Move focus to parent container
    bindsym $mod+a focus parent
#
# Scratchpad:
#
    bindsym $mod+Shift+minus move scratchpad
    bindsym $mod+minus scratchpad show
#
# Resizing:
#
mode "resize" {
    bindsym $left resize shrink width 10px
    bindsym $down resize grow height 10px
    bindsym $up resize shrink height 10px
    bindsym $right resize grow width 10px

    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px

    bindsym Return mode "default"
    bindsym Escape mode "default"
}
bindsym $mod+r mode "resize"
#
# Utilities:
#
    # Power button: confirm before shutdown
    bindsym --locked XF86PowerOff exec swaynag -t warning -m 'Power off?' -B 'Yes' 'systemctl poweroff'

    # Lock screen
    bindsym $mod+Shift+x exec swaylock -f

    # Volume control
    bindsym --locked XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
    bindsym --locked XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
    bindsym --locked XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
    bindsym --locked XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle
    # Media control
    bindsym --locked XF86AudioPlay exec playerctl play-pause
    bindsym --locked XF86AudioNext exec playerctl next
    bindsym --locked XF86AudioPrev exec playerctl previous
    # Brightness control
    bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
    bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+

    # Screenshot: select region → clipboard
    bindsym $mod+Shift+s exec grim -g "$(slurp)" - | wl-copy
    # Screenshot: full screen → clipboard
    bindsym Print exec grim - | wl-copy
    # Screenshot: select region → file
    bindsym Shift+Print exec mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png
    # Screenshot: full screen → file
    bindsym Ctrl+Print exec mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png

  # Bind a key to toggle the panel visibility
  bindsym $mod+n exec wifi-manager --toggle
    # Audio mixer
    bindsym $mod+F9 exec pavucontrol
    # Bluetooth manager
    bindsym $mod+F10 exec blueman-manager
    # Display manager
    bindsym $mod+F11 exec wdisplays

    # App launchers
    bindsym $mod+e exec kitty yazi
    bindsym $mod+b exec zen-browser, workspace 2
    bindsym $mod+o exec flatpak run md.obsidian.Obsidian, workspace 3

    # Switch focus between screens
    bindsym $mod+semicolon focus output next

    # Toggle waybar (kill to hide, spawn to show — avoids SIGUSR1 repaint artifact)
    # Maintains waybar-hidden state file so set-theme knows not to respawn on CSS reload
    bindsym $mod+Shift+b exec sh -c '\
      f="${XDG_STATE_HOME:-$HOME/.local/state}/waybar-hidden"; \
      if pgrep -x waybar >/dev/null; then \
        pkill -x waybar; : > "$f"; \
      else \
        rm -f "$f"; waybar & \
      fi'

    # Theme picker
    bindsym $mod+Shift+t exec ~/.local/bin/theme-picker

    # Wallpaper picker
    bindsym $mod+Shift+w exec ~/.local/bin/wallpaper-picker

    # Toggle window opacity
    bindsym $mod+Shift+o exec ~/.config/sway/toggle-opacity.sh

    # Toggle window blur
    bindsym $mod+Shift+i exec ~/.config/sway/toggle-blur.sh
