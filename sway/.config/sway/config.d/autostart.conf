### Autostart
#
# Export Wayland/desktop env vars to D-Bus so portals (screen share) work
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

exec kwalletd6
exec swaync
exec nm-applet --indicator
exec blueman-applet
exec wifi-manager
exec swww-daemon

# Restore last wallpaper on startup via swww
exec sh -c 'f="${XDG_STATE_HOME:-$HOME/.local/state}/current-wall"; [ -r "$f" ] && swww img "$(cat "$f")"'
