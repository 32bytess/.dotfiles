### Autostart
#
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec systemctl --user stop xdg-desktop-portal xdg-desktop-portal-wlr xdg-desktop-portal-gtk
exec systemctl --user start xdg-desktop-portal-wlr xdg-desktop-portal-gtk
exec /usr/libexec/xdg-desktop-portal --replace &

exec ~/.local/bin/waybar
exec kwalletd6
exec swaync
exec nm-applet --indicator
exec blueman-applet
exec wifi-manager

# Restore last wallpaper on startup via swaybg
exec sh -c 'f="${XDG_STATE_HOME:-$HOME/.local/state}/current-wall"; [ -r "$f" ] && swaybg -i "$(cat "$f")" -m fill'
