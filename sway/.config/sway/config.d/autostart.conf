### Autostart
#
# Export Wayland/desktop env vars to D-Bus so portals (screen share) work
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

exec ~/.local/bin/waybar
exec kwalletd6
exec swaync
exec nm-applet --indicator
exec blueman-applet
exec wifi-manager

# Restore last wallpaper on startup via swaybg
exec sh -c 'f="${XDG_STATE_HOME:-$HOME/.local/state}/current-wall"; [ -r "$f" ] && swaybg -i "$(cat "$f")" -m fill'
