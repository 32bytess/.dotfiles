### Autostart
#
# Export Wayland/desktop env vars to D-Bus so portals (screen share) work
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

exec kwalletd6
exec swaync
exec nm-applet --indicator
exec blueman-applet

# Idle management: lock after 10min, screen off after 15min, lock before suspend
exec swayidle -w \
    timeout 600 'swaylock -f' \
    timeout 900 'swaymsg "output * dpms off"' resume 'swaymsg "output * dpms on"' \
    before-sleep 'swaylock -f'

# Restore last wallpaper on startup
exec sh -c 'f="${XDG_STATE_HOME:-$HOME/.local/state}/sway-wallpaper"; [ -r "$f" ] && swaymsg output "*" bg "$HOME/dotfiles/wallpapers/$(cat "$f")" fill'

# Restore last used theme on startup only.
# Using `exec` (not `exec_always`) so reload doesn't re-trigger waybar's SIGUSR2 —
# that resets waybar's hidden-state and makes the bar reappear on every reload.
exec sh -c '"${HOME}/.local/bin/set-theme" "$(cat "${XDG_STATE_HOME:-$HOME/.local/state}/sway-theme" 2>/dev/null || echo tokyonight)"'
