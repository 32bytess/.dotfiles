### Window appearance
#
default_border pixel 2
default_floating_border pixel 2

gaps inner 3
gaps outer 3

# SwayFX effects
corner_radius 10
blur on
blur_xray on
blur_passes 1
blur_radius 5
shadows on
default_dim_inactive 0.05

layer_effects "waybar" {
	blur enable;
	blur_xray enable;
	blur_ignore_transparent enable;
}


for_window [app_id=".*"] opacity $opacity
for_window [class=".*"] opacity $opacity

