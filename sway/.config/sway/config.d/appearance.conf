### Window appearance
#
default_border pixel 2
default_floating_border pixel 2

gaps inner 4
gaps outer 4

# SwayFX effects
corner_radius 10
blur on 
blur_passes 2
blur_radius 5
shadows on
default_dim_inactive 0.05

for_window [app_id=".*"] opacity $opacity
for_window [class=".*"] opacity $opacity

# Blur for floating overlays
for_window [app_id="wofi"] blur enable, corner_radius 12
