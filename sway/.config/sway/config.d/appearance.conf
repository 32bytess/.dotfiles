### Window appearance
#
default_border pixel 2
default_floating_border pixel 2

# Force server-side decorations (removes CSD title bars on GTK apps)
exec_always gsettings set org.gnome.desktop.wm.preferences button-layout ''

gaps inner 2
gaps outer 4

# SwayFX effects
corner_radius 10
blur off
blur_passes 2
blur_radius 5
shadows on
default_dim_inactive 0.05

# Blur for floating overlays
for_window [app_id="wofi"] blur enable, corner_radius 12

# Restore last used theme on reload
exec_always sh -c '"${HOME}/.local/bin/set-theme" "$(cat "${XDG_STATE_HOME:-$HOME/.local/state}/sway-theme" 2>/dev/null || echo tokyonight)"'
