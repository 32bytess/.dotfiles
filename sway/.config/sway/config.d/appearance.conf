### Window appearance
#
default_border pixel 2
default_floating_border pixel 2

# Force server-side decorations (removes CSD title bars on GTK apps)
exec_always gsettings set org.gnome.desktop.wm.preferences button-layout ''

gaps inner 2
gaps outer 4

# SwayFX effects
corner_radius 10
blur off
blur_passes 2
blur_radius 5
shadows on
default_dim_inactive 0.05

# Rosé Pine border colors
# class                 border         bg        text          indicator    child_border
client.focused          #ebbcba    #191724    #e0def4    #ebbcba    #ebbcba
client.unfocused        #26233a    #191724    #6e6a86    #26233a    #26233a
client.focused_inactive #26233a    #191724    #6e6a86    #26233a    #26233a
client.urgent           #eb6f92    #191724    #eb6f92    #eb6f92    #eb6f92
