### Window appearance
#
default_border pixel 2
default_floating_border pixel 2

gaps inner 3
gaps outer 3

# SwayFX effects
corner_radius 10
blur on
blur_passes 3
blur_radius 7
shadows on
default_dim_inactive 0.05

for_window [app_id=".*"] opacity $opacity
for_window [class=".*"] opacity $opacity

# Blur for floating overlays
for_window [app_id="rofi"] blur enable, corner_radius 12

