### Output configuration
#
output eDP-1 resolution 1920x1080 position 0,0

output HDMI-A-1 resolution 1920x1080 position 1920,0 transform 270
# output HDMI-A-1 resolution 1920x1080 position 1920,0

# Workspace -> output assignments
workspace 1 output eDP-1
workspace 2 output eDP-1
workspace 3 output eDP-1
workspace 4 output eDP-1
workspace 5 output eDP-1
workspace 6 output eDP-1
workspace 7 output HDMI-A-1
workspace 8 output HDMI-A-1
workspace 9 output HDMI-A-1
workspace 10 output HDMI-A-1

# App -> workspace assignments
# Note: Obsidian and Discord run under XWayland, so they match on class=, not app_id=
assign [app_id="^zen"] workspace 2
assign [class="obsidian"] workspace 3
assign [app_id="md.obsidian.Obsidian"] workspace 3
assign [class="[Dd]iscord"] workspace 7
assign [app_id="com.spotify.Client"] workspace 7
