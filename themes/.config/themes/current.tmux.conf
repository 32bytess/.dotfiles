set -g status-style "fg=#bdbdbd"
set -g status-right "#[fg=#80a0ff,bold] %d %B %y - %H:%M "
set -g window-status-format "#{?#{==:#{session_windows},1},, #[fg=#4e4e4e,nobold]#I.#W }"
set -g window-status-current-format "#{?#{==:#{session_windows},1},, #[fg=#80a0ff,bold]*.#W }"
set -g pane-border-style "fg=#1c1c1c"
set -g pane-active-border-style "fg=#cf87e8"
