[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true

[preview]
image_filter  = "lanczos3"
image_quality = 75
tab_size      = 2
max_width     = 600
max_height    = 900

[opener]
edit = [
  { run = 'nvim "$@"', desc = "Edit with Neovim", block = true },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", orphan = true },
]

[open]
rules = [
  { mime = "text/*",        use = ["edit", "open"] },
  { mime = "image/*",       use = ["open"] },
  { mime = "video/*",       use = ["open"] },
  { mime = "audio/*",       use = ["open"] },
  { mime = "inode/x-empty", use = ["edit"] },
  { mime = "*",             use = ["open", "edit"] },
]

[tasks]
micro_workers = 10
macro_workers = 25

[log]
enabled = false
