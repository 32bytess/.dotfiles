[manager]
cwd             = { fg = "#7aa2f7" }
hovered         = { fg = "#1a1b26", bg = "#7aa2f7" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#e0af68", bold = true, italic = true, underline = true }
find_position = { fg = "#bb9af7", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#9ece6a", bg = "#9ece6a" }
marker_cut      = { fg = "#f7768e", bg = "#f7768e" }
marker_marked   = { fg = "#bb9af7", bg = "#bb9af7" }
marker_selected = { fg = "#7aa2f7", bg = "#7aa2f7" }

tab_active   = { fg = "#1a1b26", bg = "#7aa2f7" }
tab_inactive = { fg = "#c0caf5", bg = "#414868" }
tab_width    = 1

count_copied   = { fg = "#1a1b26", bg = "#9ece6a" }
count_cut      = { fg = "#1a1b26", bg = "#f7768e" }
count_selected = { fg = "#1a1b26", bg = "#7aa2f7" }

border_symbol = "│"
border_style  = { fg = "#414868" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#414868", bg = "#414868" }

mode_normal = { fg = "#1a1b26", bg = "#7aa2f7", bold = true }
mode_select = { fg = "#1a1b26", bg = "#9ece6a", bold = true }
mode_unset  = { fg = "#1a1b26", bg = "#f7768e",    bold = true }

progress_label  = { bold = true }
progress_normal = { fg = "#7aa2f7", bg = "#414868" }
progress_error  = { fg = "#f7768e",    bg = "#414868" }

perm_type  = { fg = "#7aa2f7" }
perm_read  = { fg = "#e0af68" }
perm_write = { fg = "#f7768e" }
perm_exec  = { fg = "#9ece6a" }
perm_sep   = { fg = "#414868" }

[input]
border   = { fg = "#7aa2f7" }
title    = {}
value    = {}
selected = { reversed = true }

[completion]
border   = { fg = "#7aa2f7" }
active   = { bg = "#414868" }
inactive = {}

[tasks]
border  = { fg = "#7aa2f7" }
title   = {}
hovered = { underline = true }

[which]
mask            = { bg = "#16161e" }
cand            = { fg = "#7dcfff" }
rest            = { fg = "#9aa5ce" }
desc            = { fg = "#bb9af7" }
separator       = "  "
separator_style = { fg = "#414868" }

[help]
on      = { fg = "#bb9af7" }
run     = { fg = "#bb9af7" }
desc    = { fg = "#9aa5ce" }
hovered = { bg = "#414868", bold = true }
footer  = { fg = "#414868", bg = "#c0caf5" }

[filetype]
rules = [
  { mime = "image/*",                     fg = "#7dcfff" },
  { mime = "video/*",                     fg = "#bb9af7" },
  { mime = "audio/*",                     fg = "#e0af68" },
  { mime = "application/zip",             fg = "#f7768e" },
  { mime = "application/gzip",            fg = "#f7768e" },
  { mime = "application/x-tar",           fg = "#f7768e" },
  { mime = "application/x-bzip2",         fg = "#f7768e" },
  { mime = "application/x-7z-compressed", fg = "#f7768e" },
  { mime = "application/x-rar",           fg = "#f7768e" },
  { name = "*",                           fg = "#c0caf5" },
  { name = "*/",                          fg = "#7aa2f7" },
]
