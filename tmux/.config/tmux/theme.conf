set -g status-style "fg=#F8E4DC"
set -g status-right "#[fg=#F1D8CF,bold] %d %B %y - %H:%M "
set -g window-status-format "#{?#{==:#{session_windows},1},, #[fg=#F1D8CF,nobold]#I.#W }"
set -g window-status-current-format "#{?#{==:#{session_windows},1},, #[fg=#DA5757,bold]*.#W }"
set -g pane-border-style "fg=#0E0A0A"
set -g pane-active-border-style "fg=#9098A1"
