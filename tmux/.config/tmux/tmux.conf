set-option -sa terminal-overrides ",xterm*:Tc"
set -g base-index 1
set-option -g renumber-windows on
set -g allow-passthrough on

# Keybindings

# Prefix: Ctrl+s
set -g prefix C-s

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window navigation with Alt+number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Status bar
set -g mouse on
setw -g mode-keys vi
set -g status-position bottom
set -g status-interval 5
set -g status on

if-shell "[ -f ~/.config/tmux/theme.conf ]" \
    "source-file ~/.config/tmux/theme.conf"

bind-key -n C-_ if-shell '[ "$(tmux display-message -p "#I")" = "1" ]' \
    'if-shell "tmux select-window -t 2" "" "new-window"' \
    'select-window -t 1'

# Window list centre, status-left (path) left, time right
set -g status-left " #(echo #{pane_current_path} | sed s:${HOME}:~:) "
set -g status-left-length 100
set -g status-right " %a %d %b %H:%M "
set -g window-status-separator ""

# 1 window: path left, time centre | multiple: path left, windows centre, time right

# Tmux sessionizer (prefix+f)
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Toggle status bar with prefix+y
bind y if-shell '[ "$(tmux show-option -gv status)" != "off" ]' \
		'set -g status off' \
		'set -g status on'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Install plugins under the XDG path (consistent with the rest of the config)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# Initialize TPM (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'

# Fix for kitty graphics in tmux
set -as terminal-features 'xterm-kitty:images'
