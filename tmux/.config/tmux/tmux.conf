set-option -sa terminal-overrides ",xterm*:Tc"
set -g base-index 1
set-option -g renumber-windows on

# Keybindings

# Prefix: Ctrl+s
set -g prefix C-s

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar
set -g mouse on
setw -g mode-keys vi
set -g status-position top
set -g status-style "fg=#cdd6f4"
set -g status-interval 5

# Auto-show status bar when multiple windows exist (per-session)
set-hook -g session-created 'set status off'
set-hook -g window-linked   'if-shell "[ $(tmux list-windows | wc -l) -gt 1 ]" "set status on"  "set status off"'
set-hook -g window-unlinked 'if-shell "[ $(tmux list-windows | wc -l) -gt 1 ]" "set status on"  "set status off"'

# Window list
set -g status-left ""
set -g status-right "#[fg=#89b4fa,bold] %H:%M "
set -g status-right-length 60
set -g status-justify centre

set -g window-status-format         "#[fg=#6c7086,nobold] #I.#W "
set -g window-status-current-format "#[fg=#89b4fa,bold] *.#W "
set -g window-status-style          "default"
set -g window-status-current-style  "default"
set -g window-status-separator      ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Tmux sessionizer (prefix+f)
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Toggle status bar with prefix+y
bind y if-shell '[ "$(tmux show-option -gv status)" != "off" ]' \
    'set -g status off' \
    'set -g status on'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
